# Provider credentials are environment-variable names only. Each model mapping
# carries its canonical display name, context length, provider-native model id,
# and per-million-token provider costs. sell_prices is the reviewed pre-Gateway
# customer subtotal and stays route-independent. OpenRouter remains the
# lowest-priority fallback while direct provider coverage is built out.
sell_prices:
  - slug: openai/gpt-5.6-luna
    input_price_per_mtok: "1.00"
    output_price_per_mtok: "6.00"
  - slug: anthropic/claude-sonnet-5
    input_price_per_mtok: "2.00"
    output_price_per_mtok: "10.00"
  - slug: google/gemini-3.6-flash
    input_price_per_mtok: "1.50"
    output_price_per_mtok: "7.50"
  - slug: meta-llama/llama-3.3-70b-instruct
    input_price_per_mtok: "0.13"
    output_price_per_mtok: "0.40"
  - slug: deepseek/deepseek-v4-flash
    input_price_per_mtok: "0.0938"
    output_price_per_mtok: "0.1876"
  - slug: z-ai/glm-5.2
    input_price_per_mtok: "0.70"
    output_price_per_mtok: "2.20"
  - slug: moonshotai/kimi-k3
    input_price_per_mtok: "3.00"
    output_price_per_mtok: "15.00"

providers:
  - id: openrouter
    display_name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    secret_env: SEREN_ROUTER_KEY_OPENROUTER
    enabled: true
    priority: 255
    profiles: [production, beta]
    models:
      - slug: openai/gpt-5.6-luna
        name: OpenAI GPT-5.6 Luna
        context_length: 1050000
        provider_model_id: openai/gpt-5.6-luna
        input_price_per_mtok: "1.00"
        output_price_per_mtok: "6.00"
      - slug: anthropic/claude-sonnet-5
        name: Anthropic Claude Sonnet 5
        context_length: 1000000
        provider_model_id: anthropic/claude-sonnet-5
        input_price_per_mtok: "2.00"
        output_price_per_mtok: "10.00"
      - slug: google/gemini-3.6-flash
        name: Google Gemini 3.6 Flash
        context_length: 1048576
        provider_model_id: google/gemini-3.6-flash
        input_price_per_mtok: "1.50"
        output_price_per_mtok: "7.50"
      - slug: meta-llama/llama-3.3-70b-instruct
        name: Meta Llama 3.3 70B Instruct
        context_length: 131072
        provider_model_id: meta-llama/llama-3.3-70b-instruct
        input_price_per_mtok: "0.13"
        output_price_per_mtok: "0.40"
      - slug: deepseek/deepseek-v4-flash
        name: DeepSeek V4 Flash
        context_length: 1048576
        provider_model_id: deepseek/deepseek-v4-flash
        input_price_per_mtok: "0.0938"
        output_price_per_mtok: "0.1876"
      - slug: z-ai/glm-5.2
        name: Z.ai GLM 5.2
        context_length: 1048576
        provider_model_id: z-ai/glm-5.2
        input_price_per_mtok: "0.70"
        output_price_per_mtok: "2.20"
      - slug: moonshotai/kimi-k3
        name: MoonshotAI Kimi K3
        context_length: 1048576
        provider_model_id: moonshotai/kimi-k3
        input_price_per_mtok: "3.00"
        output_price_per_mtok: "15.00"

  - id: deepinfra
    display_name: DeepInfra
    base_url: https://api.deepinfra.com/v1/openai
    secret_env: SEREN_ROUTER_KEY_DEEPINFRA
    enabled: false
    priority: 0
    profiles: [beta]
    models:
      - slug: meta-llama/llama-3.3-70b-instruct
        name: Meta Llama 3.3 70B Instruct
        context_length: 131072
        provider_model_id: meta-llama/Llama-3.3-70B-Instruct-Turbo
        input_price_per_mtok: "0.10"
        output_price_per_mtok: "0.32"
