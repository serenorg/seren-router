# Provider credentials are environment-variable names only. Each model mapping
# carries its canonical display name, context length, provider-native model id,
# and exact per-million-token provider costs. OpenRouter remains the
# lowest-priority fallback while direct provider coverage is built out.
providers:
  - id: openrouter
    display_name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    secret_env: SEREN_ROUTER_KEY_OPENROUTER
    enabled: true
    priority: 255
    profiles: [production, beta]
    models:
      - slug: openai/gpt-5.6-luna
        name: OpenAI GPT-5.6 Luna
        context_length: 1050000
        provider_model_id: openai/gpt-5.6-luna
        input_price_per_mtok: "1.00"
        output_price_per_mtok: "6.00"
      - slug: anthropic/claude-sonnet-5
        name: Anthropic Claude Sonnet 5
        context_length: 1000000
        provider_model_id: anthropic/claude-sonnet-5
        input_price_per_mtok: "2.00"
        output_price_per_mtok: "10.00"
      - slug: google/gemini-3.6-flash
        name: Google Gemini 3.6 Flash
        context_length: 1048576
        provider_model_id: google/gemini-3.6-flash
        input_price_per_mtok: "1.50"
        output_price_per_mtok: "7.50"
      - slug: meta-llama/llama-3.3-70b-instruct
        name: Meta Llama 3.3 70B Instruct
        context_length: 131072
        provider_model_id: meta-llama/llama-3.3-70b-instruct
