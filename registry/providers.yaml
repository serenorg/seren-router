        name: Z.ai GLM 5.2
        context_length: 1048576
        provider_model_id: z-ai/glm-5.2
        input_price_per_mtok: "0.6993"
        cached_input_price_per_mtok: "0.12987"
        output_price_per_mtok: "2.1978"
      - slug: moonshotai/kimi-k3
        name: MoonshotAI Kimi K3
        context_length: 1048576
