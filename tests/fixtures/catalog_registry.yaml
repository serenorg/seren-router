sell_prices:
  - slug: anthropic/claude-opus-5-fast
    input_price_per_mtok: "10"
    output_price_per_mtok: "50"
  - slug: openai/gpt-5-mini
    input_price_per_mtok: "0.25"
    output_price_per_mtok: "2"

providers:
  - id: balanced
    display_name: Balanced Provider
    base_url: https://balanced.example/v1
    secret_env: SEREN_ROUTER_KEY_BALANCED
    enabled: true
    priority: 10
    models:
      - slug: anthropic/claude-opus-5-fast
        name: Claude Opus 5 (Fast)
        context_length: 1000000
        provider_model_id: anthropic/claude-opus-5-fast
        input_price_per_mtok: "10"
        output_price_per_mtok: "50"

  - id: cheap-input
    display_name: Cheap Input Provider
    base_url: https://cheap-input.example/v1
    secret_env: SEREN_ROUTER_KEY_CHEAP_INPUT
    enabled: true
    priority: 20
    models:
      - slug: anthropic/claude-opus-5-fast
        name: Claude Opus 5 Fast Alternate
        context_length: 750000
        provider_model_id: claude-opus-5-fast
        input_price_per_mtok: "5"
        output_price_per_mtok: "70"
      - slug: openai/gpt-5-mini
        name: GPT-5 Mini
        context_length: 400000
        provider_model_id: gpt-5-mini
        input_price_per_mtok: "0.25"
        output_price_per_mtok: "2"

  - id: disabled
    display_name: Disabled Provider
    base_url: https://disabled.example/v1
    secret_env: SEREN_ROUTER_KEY_DISABLED
    enabled: false
    priority: 0
    models:
      - slug: anthropic/claude-opus-5-fast
        name: Disabled Claude
        context_length: 2000000
        provider_model_id: disabled-claude
        input_price_per_mtok: "0"
        output_price_per_mtok: "0"
