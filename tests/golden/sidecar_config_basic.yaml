config:
  readinessAddr: 127.0.0.1:19001
  enableIpv6: false
llm:
  port: 4000
  models:
  - name: slow/acme/shared
    provider: openAI
    params:
      baseUrl: http://127.0.0.1:4101/v1
      model: slow-shared
      apiKey: $SEREN_ROUTER_KEY_SLOW
    passthrough: detect
    overrides:
      model: slow-shared
    responseHeaders:
      set:
        x-seren-served-provider: slow
    health:
      eviction:
        consecutiveFailures: 1
        duration: 60s
  - name: slow/acme/exclusive
    provider: openAI
    params:
      baseUrl: http://127.0.0.1:4101/v1
      model: slow-exclusive
      apiKey: $SEREN_ROUTER_KEY_SLOW
    passthrough: detect
    overrides:
      model: slow-exclusive
    responseHeaders:
      set:
        x-seren-served-provider: slow
    health:
      eviction:
        consecutiveFailures: 1
        duration: 60s
  - name: fast/acme/shared
    provider: openAI
    params:
      baseUrl: http://127.0.0.1:4102/v1
      model: fast-shared
      apiKey: $SEREN_ROUTER_KEY_FAST
    passthrough: detect
    overrides:
      model: fast-shared
    responseHeaders:
      set:
        x-seren-served-provider: fast
    health:
      eviction:
        consecutiveFailures: 1
        duration: 60s
  virtualModels:
  - name: seren-profile-production/acme/exclusive
    routing:
      failover:
        targets:
        - model: slow/acme/exclusive
          priority: 20
  - name: seren-profile-production/acme/shared
    routing:
      failover:
        targets:
        - model: fast/acme/shared
          priority: 5
        - model: slow/acme/shared
          priority: 20
policies:
- name:
    name: llm-retry
    namespace: internal
  target:
    route:
      name: llm:request
      namespace: internal
  policy:
    retry:
      attempts: 2
      codes:
      - 429
      condition: response.code >= 500 && response.code < 600
