config:
  readinessAddr: 127.0.0.1:19001
llm:
  port: 4000
  models:
  - name: slow/acme/shared
    provider: openAI
    params:
      baseUrl: http://127.0.0.1:4101/v1
      model: slow-shared
      apiKey: $SEREN_ROUTER_KEY_SLOW
    health:
      eviction:
        consecutiveFailures: 1
        duration: 60s
  - name: slow/acme/exclusive
    provider: openAI
    params:
      baseUrl: http://127.0.0.1:4101/v1
      model: slow-exclusive
      apiKey: $SEREN_ROUTER_KEY_SLOW
    health:
      eviction:
        consecutiveFailures: 1
        duration: 60s
  - name: fast/acme/shared
    provider: openAI
    params:
      baseUrl: http://127.0.0.1:4102/v1
      model: fast-shared
      apiKey: $SEREN_ROUTER_KEY_FAST
    health:
      eviction:
        consecutiveFailures: 1
        duration: 60s
  virtualModels:
  - name: acme/shared
    routing:
      failover:
        targets:
        - model: fast/acme/shared
          priority: 5
        - model: slow/acme/shared
          priority: 20
