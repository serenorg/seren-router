[package]
name = "seren-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["SerenAI <hello@serendb.com>"]
license-file = "LICENSE"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "trace", "timeout", "request-id", "catch-panic",
    "set-header", "normalize-path"
] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "json", "rust_decimal", "tls-rustls", "migrate"] }
jiff-sqlx = { version = "0.2", features = ["postgres"] }

# HTTP client (rustls to avoid a system OpenSSL dependency, matching the sqlx tls-rustls backend)
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml = "0.9"

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
bytes = "1"
futures = "0.3"
rand = "0.10"
rust_decimal = { version = "1", features = ["serde"] }
subtle = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment
dotenvy = "0.15"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "jiff_0_2"] }
utoipa-axum = "0.2"

# --- Feature-gated middleware dependencies ---
axum-prometheus = { version = "0.10", optional = true }
prometheus = { version = "0.14", optional = true }
axum-helmet = { version = "1.0", optional = true }
helmet-core = { version = "1.0", optional = true }
tower_governor = { version = "0.8", optional = true }

# --- Optional dependencies (uncomment as needed) ---

# Crypto / encoding
# base64 = "0.22"
# sha2 = "0.10"
# hmac = "0.12"
# hex = "0.4"

# URL handling
# url = "2"
# percent-encoding = "2"

# Additional auth mechanisms are unnecessary. `crate::gateway_auth` owns the
# static Gateway bearer middleware.
# jsonwebtoken = "10"
# oauth2 = "5.0"

[features]
default = []
metrics = ["dep:axum-prometheus", "dep:prometheus"]
security-headers = ["dep:axum-helmet", "dep:helmet-core"]
compression = ["tower-http/compression-full", "tower-http/decompression-full"]
payload-limit = ["tower-http/limit"]
sensitive-headers = ["tower-http/sensitive-headers"]
cors = ["tower-http/cors"]
rate-limiting = ["dep:tower_governor"]
concurrency-limit = ["tower/limit"]
production = ["metrics", "security-headers", "payload-limit", "sensitive-headers"]
full = ["production", "cors", "compression", "rate-limiting", "concurrency-limit"]
