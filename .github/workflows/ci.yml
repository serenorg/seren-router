name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_OFFLINE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned agentgateway
        run: ./scripts/fetch-sidecar.sh

      - name: Verify pinned agentgateway
        shell: bash
        run: |
          pinned_version="$(sed -n '1p' sidecar/PINNED_VERSION)"
          expected_version="${pinned_version#v}"
          version_json="$(./sidecar/bin/agentgateway --version)"
          actual_version="$(
            sed -n \
              's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)"[[:space:]]*,[[:space:]]*$/\1/p' \
              <<<"$version_json"
          )"

          printf '%s\n' "$version_json"
          test -n "$expected_version"
          test "$actual_version" = "$expected_version"

      - name: Verify pinned agentgateway image
        run: ./scripts/verify-sidecar-image.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Validate compiled sidecar config
        run: |
          cargo test --test sidecar_config_validation \
            compiled_config_validates_with_pinned_sidecar \
            -- --ignored --exact
          cargo test --test sidecar_config_validation \
            production_registry_validates_with_pinned_sidecar \
            -- --ignored --exact

      - name: Validate composite readiness with pinned sidecar
        run: |
          cargo test --test functional \
            harness::functional_composite_readiness_tracks_real_sidecar_lifecycle \
            -- --ignored --exact --test-threads=1

      - name: Smoke production deployment image
        run: ./scripts/deployment-smoke.sh
